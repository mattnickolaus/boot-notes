<!DOCTYPE html>
<html>
	<head>
		<title>Boot Notes</title>
		<link rel="stylesheet" href="/src/popup.css">
		<script type="module" src="/src/popup.ts"></script>
	</head>
	<body>
		<div id="header">
			<h1>Boot Notes</h1>
			<img src="icons/icon128.png" alt="Boots holding a Notebook">
		</div>
		<div id="lesson-title">
			<span>Lesson</span>
			<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" data-lucide="align-left" class="lucide lucide-align-left lucide-icon"><line x1="21" x2="3" y1="6" y2="6"></line><line x1="15" x2="3" y1="12" y2="12"></line><line x1="17" x2="3" y1="18" y2="18"></line></svg>
			<span id="lesson-header"></span>
		</div>
		<div id="options">
			<input type="checkbox" id="includeCodeCheckbox" name="includeCode">
			<label for="includeCodeCheckbox">Include Assignment Code</label>
		</div>
		<button id="extractButton">
			<svg data-slot="icon" aria-hidden="true" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
				<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
			</svg>
			<span> Copy Lesson</span>
		</button>
		<p id="statusMessage"></p>
	</body>
</html>
